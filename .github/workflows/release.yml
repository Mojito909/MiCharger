name: Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整历史，构建时按提交数生成版本号

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      # 与 app/build.gradle.kts 的版本公式保持一致：逢十进位（1.0.10 → 1.1.0）
      - name: Compute version and rename APK
        run: |
          N=$(git rev-list --count HEAD)
          VERSION=$(awk -v n=$N 'BEGIN{printf "%d.%d.%d", 1+int(n/100), int(n%100/10), n%10}')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "MiCharger-$VERSION.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiCharger-apk-${{ env.VERSION }}
          path: MiCharger-*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: MiCharger-*.apk
